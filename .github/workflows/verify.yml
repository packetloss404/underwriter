name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --locked --all-groups
      - name: Install pinned Alpaca CLI
        run: |
          curl --fail --show-error --location \
            https://github.com/alpacahq/cli/releases/download/v0.0.14/cli_0.0.14_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/alpaca.tar.gz"
          tar -xzf "$RUNNER_TEMP/alpaca.tar.gz" -C "$RUNNER_TEMP" alpaca
          mkdir -p "$HOME/.local/bin"
          install -m755 "$RUNNER_TEMP/alpaca" "$HOME/.local/bin/alpaca"
          "$HOME/.local/bin/alpaca" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:closeout
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
