[project]
name = "underwriter"
version = "0.1.0"
description = "Autonomous paper-only agent that harvests the volatility risk premium with defined-risk ETF credit spreads (Alpaca AI Trading Agents Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "alpaca-py>=0.44.0",
    # alpaca-py declares only pandas>=1.5.3 and upstream CI tests neither pandas 3.x
    # nor Python 3.12. Pin the minor we actually verified. See docs/GOTCHAS.md #7.
    "pandas>=3.0.5,<3.1",
    "anthropic>=0.40.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
underwriter = "underwriter.cli:app"
calibrate = "underwriter.calibrate:main"
underwriter-serve = "underwriter.serve:main"
underwriter-export = "underwriter.export:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
    "freezegun>=1.5",
    "respx>=0.21",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriter"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ holds research artefacts and one-off analysis scripts produced during
# kickoff research. They are kept for the record, not maintained as source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async correctness
    "S",                # bandit — security
    "DTZ",              # naive-datetime bans; timezone correctness matters here
    "T20",              # no stray print() in library code
    "RET", "ARG", "PTH",
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "T20"]
"src/underwriter/cli.py" = ["T20"]
"src/underwriter/calibrate.py" = ["T20"]
"src/underwriter/export.py" = ["T20"]
"src/underwriter/serve.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alpaca.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: hits the live Alpaca paper API; requires credentials",
    "slow: long-running",
]
